name: probe-reusable
on:
  workflow_call:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "#2 whose tree did a default checkout produce"
        run: |
          set -u
          ls MARKER-*.txt 2>/dev/null || echo "(no markers)"
          if [ -f MARKER-caller.txt ]; then
            echo "RESULT2: CALLER tree - correct, the design assumption holds"
          elif [ -f MARKER-template.txt ]; then
            echo "RESULT2: TEMPLATE tree - WRONG, scanners would scan the wrong repo"
          else
            echo "RESULT2: INDETERMINATE"
          fi
          echo "ORIGIN: $(git remote get-url origin 2>/dev/null || echo none)"
      - name: "C does the OIDC token carry job_workflow_ref"
        run: |
          set -uo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "RESULTC: NO_TOKEN - caller did not grant id-token write"
            exit 0
          fi
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=probe" -o t.json
          body="$(jq -r .value t.json | cut -d. -f2)"
          pad=$(( (4 - ${#body} % 4) % 4 ))
          [ "$pad" -eq 0 ] || body="${body}$(printf '=%.0s' $(seq 1 "$pad"))"
          printf '%s' "$body" | tr '_-' '/+' | base64 -d > claims.json
          echo "CLAIM job_workflow_ref: $(jq -r '.job_workflow_ref // "<ABSENT>"' claims.json)"
          echo "CLAIM workflow_ref:     $(jq -r '.workflow_ref // "<ABSENT>"' claims.json)"
          echo "CLAIM repository:       $(jq -r '.repository // "<ABSENT>"' claims.json)"
          echo "CLAIM sub:              $(jq -r '.sub // "<ABSENT>"' claims.json)"
          if [ "$(jq -r 'has("job_workflow_ref")' claims.json)" = "true" ]; then
            echo "RESULTC: PRESENT"
          else
            echo "RESULTC: ABSENT"
          fi
          rm -f t.json claims.json
